name: Publish to PyPI

on:
  push:
    branches: ["main"]

permissions:
  contents: write

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  publish:
    name: Bump version and publish
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip publish]')"

    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Bump patch version in pyproject.toml
        id: bump
        shell: bash
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          path = pathlib.Path("pyproject.toml")
          text = path.read_text(encoding="utf-8")
          match = re.search(r'^version\s*=\s*"(\d+)\.(\d+)\.(\d+)"', text, re.MULTILINE)
          if not match:
              raise SystemExit("version field not found in pyproject.toml")
          major, minor, patch = (int(x) for x in match.groups())
          new_version = f"{major}.{minor}.{patch + 1}"
          text = re.sub(
              r'^version\s*=\s*"\d+\.\d+\.\d+"',
              f'version = "{new_version}"',
              text,
              count=1,
              flags=re.MULTILINE,
          )
          path.write_text(text, encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"new_version={new_version}\n")
          print(f"Bumped version to {new_version}")
          PY

      - name: Commit version bump and tag
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git commit -m "Bump version to ${NEW_VERSION} [skip publish]"
          git tag "v${NEW_VERSION}"
          git push origin main
          git push origin "v${NEW_VERSION}"

      - name: Install build tooling
        run: |
          python -m pip install --require-hashes --only-binary :all: -r .github/requirements/publish.txt

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist-v${{ steps.bump.outputs.new_version }}
          path: dist/

      - name: Publish to PyPI via twine
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
          TWINE_NON_INTERACTIVE: "1"
        run: python -m twine upload dist/*

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
        run: |
          gh release create "v${NEW_VERSION}" dist/* \
            --title "v${NEW_VERSION}" \
            --notes "Automated release for v${NEW_VERSION}." \
            --verify-tag
