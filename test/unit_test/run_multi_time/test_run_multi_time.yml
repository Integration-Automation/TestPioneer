pioneer_log: "test_pioneer.log"
jobs:
    steps:
        - name: start_site
          open_program: "python -m http.server 8765 --bind 127.0.0.1 --directory test/unit_test/site"
          redirect_stdout: "test_std.txt"
          redirect_stderr: "test_err.txt"
        - name: wait_for_site
          wait: 3
        - name: run_api_script
          run: test/unit_test/run_multi_time/test/api_test.json
          with: api-runner
          artifacts: ["test/unit_test/output/multi_api_*.json"]
        - name: run_load_script
          run: test/unit_test/run_multi_time/test/load_test.json
          with: load-runner
          artifacts: ["test/unit_test/output/multi_load_*.json"]
        - name: run_file_script
          run: test/unit_test/run_multi_time/test/file_test.json
          with: file-runner
        - name: stop_site
          close_program: start_site
