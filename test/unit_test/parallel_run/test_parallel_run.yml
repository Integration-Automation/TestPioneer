pioneer_log: "test_pioneer.log"
jobs:
    steps:
        - name: start_site
          open_program: "python -m http.server 8765 --bind 127.0.0.1 --directory test/unit_test/site"
        - name: wait_for_site
          wait: 3
        - name: test parallel_run
          parallel_run:
            runners: ["api-runner", "load-runner"]
            scripts: ["test/unit_test/parallel_run/test/api_test.json", "test/unit_test/parallel_run/test/load_test.json"]
            artifacts:
              - ["test/unit_test/output/parallel_api_*.json"]
              - ["test/unit_test/output/parallel_load_*.json"]
        - name: stop_site
          close_program: start_site
