# The dev channel, test_pioneer_dev. The publish-dev job of .github/workflows/ci.yml builds it by
# writing this file to pyproject.toml (scripts/dev_release.py). The version below is a floor: CI publishes
# one patch above the newest release on PyPI and commits nothing back.
[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "test_pioneer_dev"
version = "0.1.40"
authors = [
    { name = "JE-Chen", email = "jechenmailman@gmail.com" },
]
description = "Test framework for CI/CD"
requires-python = ">=3.10"
license-files = ["LICENSE"]
dependencies = ["je_web_runner",
    "je_load_density", "je_api_testka", "je-mail-thunder",
    "automation-file", "psutil", "pyyaml"
]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Environment :: X11 Applications",
    "Operating System :: OS Independent"
]

[project.urls]
Homepage = "https://github.com/Integration-Automation/TestPioneer"
Code = "https://github.com/Integration-Automation/TestPioneer"
Documentation = "https://testpioneer.readthedocs.io/"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[tool.setuptools.packages]
find = { namespaces = false }

[project.optional-dependencies]
gui = ["je_auto_control"]
